<!doctype html>
<html lang="ar" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ebaid Store - PS4 13.20 - 13.52 Jailbreak</title>
    <link rel="stylesheet" href="../theme.css" />
  </head>
  <body>
    <div class="bg"></div>
    <div class="brand-bar">
      <div class="brand-left">
        <img src="../logo.png" alt="Ebaid Store" class="brand-logo" />
        <div>
          <div class="brand-title">Ebaid Store</div>
          <div class="brand-sub">PS4 13.20 - 13.52 Exploit</div>
        </div>
      </div>
      <a href="../index.html" class="brand-home">&larr; Home</a>
    </div>
    <div id="wrap">
      <div id="state">اضغط زرار التعديل للبدء</div>
      <div id="out" style="display:none;"></div>
      <button id="run-btn" class="jb-btn">JAILBREAK - تشغيل التهكير</button>
    </div>
    <script src="../jailbreak.js"></script>
    <script>
    (function () {
        var runBtn = document.getElementById("run-btn");
        var stateEl = document.getElementById("state");
        var started = false;
        function launch() {
            if (started) return;
            started = true;
            runBtn.disabled = true;
            stateEl.textContent = "ثواني .. التهكير شغال...";
            import("./jb.js?v=10");
        }
        runBtn.addEventListener("click", launch);
        var auto = false;
        try {
            auto = window.sessionStorage.getItem("ebaidrun") === "1";
            window.sessionStorage.removeItem("ebaidrun");
        } catch (e) {}
        if (auto) { launch(); } else { stateEl.textContent = "اضغط زرار التعديل للبدء"; }
    })();
    </script>
  </body>

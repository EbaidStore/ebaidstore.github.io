<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ebaid Store - PS4 13.20 - 13.52 Jailbreak</title>
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="bg"></div>
<div class="brand-bar">
  <div class="brand-left">
    <img src="../logo.png" alt="Ebaid Store" class="brand-logo">
    <div>
      <div class="brand-title">Ebaid Store</div>
      <div class="brand-sub">PS4 13.20 - 13.52 Jailbreak</div>
    </div>
  </div>
  <a href="../index.html" class="brand-home">&larr; Home</a>
</div>
<div class="container">
  <div class="card">
    <h1 class="page-title">13.20 - 13.52</h1>
    <p class="sub" style="display:none;">اسأل ارفع الموقع -> اقفل الانترنت -> اضغط الجيلبريك</p>
    <div id="det" style="display:none;"></div>
    <div id="state">جاهز</div>
    <div id="cache"></div>
    <div class="countdown" id="cd">&nbsp;</div>
    <button id="jb-btn" class="jb-btn">JAILBREAK - تشغيل التهكير</button>
  </div>
</div>
<div id="msg"></div>
<script src="../jailbreak.js"></script>
<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var btn = document.getElementById("jb-btn");
    var cdEl = document.getElementById("cd");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "فيرموير <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; مش في جدول الكيرنل");

    var target = "jb.html" + location.search;

    btn.addEventListener("click", function () {
        if (!target) return;
        btn.disabled = true;
        setState("ثواني .. التهكير جاي ...", "warn");
        EbaidJB.countdown(5, function (n) {
            cdEl.textContent = n === 0 ? "GO" : n;
        }, function () {
            setState("بيشغل الاستغلال ...", "warn");
            setTimeout(function () {
                import("./jb.js?v=10");
            }, 200);
        });
    });

    function ready() {
        if (!target) return;
        btn.disabled = false;
        setState("اضغط زرار الجيلبريك", "warn");
    }
    if (!supported) {
        setState("اضغط زرار الجيلبريك", "warn");
        waitAnyTapToRun("اضغط زرار الجيلبريك",
            function () { ready(); });
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        ready();
    } else if (!navigator.onLine) {
        setCache("offline -- من الكاش", true);
        ready();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        ready();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        ready();
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            ready();
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            ready();
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            ready();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            ready();
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            ready();
        }, false);
    }

    function waitAnyTapToRun(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var msgEl = document.getElementById("msg");
    function onMsg() {
        if (document.body.classList.contains("done")) {
            msgEl.textContent = "التهكير تم بنجاح!";
        } else if (document.body.classList.contains("fail")) {
            msgEl.textContent = "فشل التهكير";
        }
    }
    try {
        new MutationObserver(onMsg).observe(document.body, {
            attributes: true,
            attributeFilter: ["class"],
        });
    } catch (e) {}
    onMsg();
})();
</script>
</body>
</html>

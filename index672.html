<script>
(function () {
    var stateEl = document.getElementById("state");
    var cacheEl = document.getElementById("cache");
    var btn = document.getElementById("jb-btn");
    var cdEl = document.getElementById("cd");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }

    var detEl = document.getElementById("det");
    detEl.innerHTML = "فيرموير <b>6.72</b> &middot; متحد مع باقي الصفحات";

    btn.addEventListener("click", function () {
        btn.disabled = true;
        setState("ثواني .. التهكير جاي ...", "warn");
        EbaidJB.running();
        EbaidJB.countdown(5, function (n) {
            cdEl.textContent = n === 0 ? "GO" : n;
        }, function () {
            setState("بيشغل الاستغلال ...", "warn");
            try { load_Both(); } catch (e) { EbaidJB.fail("فشل التشغيل"); }
        });
    });

    function onProgress() {
        var t = (document.getElementById("progress").textContent || "").replace(/\s+/g, " ").trim();
        if (!t) return;
        if (/Successful|Loaded Successfully|Loaded Succesfully|Already/.test(t)) EbaidJB.done();
        else if (/Failed|error|Exception/i.test(t)) EbaidJB.fail(t);
        else if (/Loading|Running|Jailbreak|Cached|caching/i.test(t)) EbaidJB.running("\u23f3 " + t);
    }
    try { new MutationObserver(onProgress).observe(document.getElementById("progress"), { childList: true, characterData: true, subtree: true }); } catch (e) {}
    onProgress();

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) { setState("اضغط زرار الجيلبريك", "warn"); }
    else if (!navigator.onLine) { setCache("offline -- من الكاش", true); setState("اضغط زرار الجيلبريك", "warn"); }
    else if (ac.status === ac.IDLE) { setCache("cached", true); setState("اضغط زرار الجيلبريك", "warn"); }
    else if (ac.status === ac.UPDATEREADY) { try { ac.swapCache(); } catch (e) {} setCache("update downloaded", true); setState("اضغط زرار الجيلبريك", "warn"); }
    else {
        setCache("checking cache...");
        ac.addEventListener("downloading", function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) { if (e && e.total) setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%"); }, false);
        ac.addEventListener("cached", function () { setCache("cached for offline use", true); setState("اضغط زرار الجيلبريك", "warn"); }, false);
        ac.addEventListener("updateready", function () { try { ac.swapCache(); } catch (e) {} setCache("update downloaded", true); setState("اضغط زرار الجيلبريك", "warn"); }, false);
        ac.addEventListener("noupdate", function () { setCache("cached -- offline ready", true); setState("اضغط زرار الجيلبريك", "warn"); }, false);
        ac.addEventListener("error", function () { setCache("cache unavailable"); setState("اضغط زرار الجيلبريك", "warn"); }, false);
    }
})();
</script>
